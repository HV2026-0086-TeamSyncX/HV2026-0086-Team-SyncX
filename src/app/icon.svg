<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="dfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A12"/>
      <stop offset="50%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#08100B"/>
    </linearGradient>

    <!-- Document Emerald Gradient -->
    <linearGradient id="dfDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="50%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#1B4332"/>
    </linearGradient>

    <!-- Financial Analysis Ray -->
    <linearGradient id="dfRayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74C69D"/>
      <stop offset="100%" stop-color="#D8F3DC"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect width="512" height="512" rx="128" fill="url(#dfBgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Geometric DocFin 'D' + Folded Financial Ledger -->
  <!-- Left Spine -->
  <rect x="130" y="120" width="48" height="272" rx="24" fill="#D8F3DC"/>

  <!-- Curved D Loop with Folded Document Corner -->
  <path d="M 178 120 
           H 270 
           C 350 120, 392 165, 392 256 
           C 392 347, 350 392, 270 392 
           H 178 
           Z" 
        fill="none" 
        stroke="url(#dfDocGrad)" 
        stroke-width="44" 
        stroke-linejoin="round"/>

  <!-- Internal Precision Financial Ticker Lines -->
  <line x1="220" y1="210" x2="310" y2="210" stroke="#74C69D" stroke-width="18" stroke-linecap="round"/>
  <line x1="220" y1="260" x2="330" y2="260" stroke="#D8F3DC" stroke-width="18" stroke-linecap="round"/>
  <line x1="220" y1="310" x2="280" y2="310" stroke="#52B788" stroke-width="18" stroke-linecap="round"/>

  <!-- Intelligent Laser Dot -->
  <circle cx="330" cy="260" r="14" fill="#FFFFFF"/>
</svg>
